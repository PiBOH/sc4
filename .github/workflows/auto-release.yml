name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the release as a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  validate-and-release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < .tools/version.txt | xargs)"
          # SemVer 2.0.0 with the repository's existing suffix convention.
          # Examples: 0.0.3-stable, 1.2.0-beta, 2.0.0-rc.1.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid Semantic Version in .tools/version.txt: $VERSION" >&2
            exit 1
          fi
          TAG="${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-stable ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate locale archives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .tools/translation-tools/locale_tools.py
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          m = runpy.run_path('.tools/translation-tools/locale_tools.py')
          files = [
              'English/SimCityLocale.dat',
              'Danish/SimCityLocale.DAT', 'Dutch/SimCityLocale.DAT',
              'Finnish/SimCityLocale.DAT', 'French/SimCityLocale.DAT',
              'German/SimCityLocale.DAT', 'Italian/SimCityLocale.dat',
              'Norwgian/SimCityLocale.DAT', 'Polish/SimCityLocale.DAT',
              'Portgese/SimCityLocale.DAT', 'Spanish/SimCityLocale.DAT',
              'Swedish/SimCityLocale.DAT', 'UKEnglsh/SimCityLocale.DAT',
          ]
          for name in files:
              db = m['DBPF'].load(name)
              assert db.index_offset + db.index_size == len(db.data), name
              ordered = sorted(db.entries, key=lambda e: e.offset)
              cursor = 96
              for entry in ordered:
                  assert entry.offset == cursor, (name, entry.key)
                  assert entry.offset + entry.size <= db.index_offset, (name, entry.key)
                  cursor = entry.offset + entry.size
              assert cursor == db.index_offset, name
              for entry in db.ltexts():
                  m['decode_resource'](entry.raw)
              print(f'validated {name}: {db.count} resources')
          PY

      - name: Build clean release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          PACKAGE="sc4-${VERSION}"
          mkdir "$PACKAGE"
          git archive --format=tar --prefix="$PACKAGE/" HEAD | tar -xf -
          rm -rf "$PACKAGE/.git" "$PACKAGE/.bkp" "$PACKAGE/.ignore"
          find "$PACKAGE" -type f \( -name '*.BAK' -o -name '*.tmp' -o -name '*.pyc' \) -delete
          zip -qr "${PACKAGE}.zip" "$PACKAGE"
          sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"
          echo "package=${PACKAGE}.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=${PACKAGE}.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Build per-language locale ZIPs
        id: languages
        shell: bash
        run: |
          set -euo pipefail
          LANGUAGES=(Danish Dutch Finnish French German Italian Norwgian Polish Portgese Spanish Swedish English UKEnglsh)
          for LANGUAGE in "${LANGUAGES[@]}"; do
            ZIPFILE="${LANGUAGE}.zip"
            zip -qr "$ZIPFILE" "$LANGUAGE"
            sha256sum "$ZIPFILE" > "${ZIPFILE}.sha256"
            echo "Zipped ${LANGUAGE} → ${ZIPFILE}"
          done

      - name: Build all-languages ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir All-languages
          for d in Danish Dutch English Finnish French German Italian Norwgian Polish Portgese Spanish Swedish UKEnglsh; do
            cp -r "$d" "All-languages/$d"
          done
          find All-languages -type f ! -iname 'SimCityLocale.dat' ! -iname 'SimCityLocale.DAT' -delete
          find All-languages -type d -empty -delete 2>/dev/null || true
          zip -qr All-languages.zip All-languages
          sha256sum All-languages.zip > All-languages.zip.sha256
          rm -rf All-languages
          echo 'Zipped All-languages.zip'

      - name: Extract changelog notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'

          # Try to extract the version section from CHANGELOG
          awk -v version="$VERSION" '
            BEGIN { found=0 }
            $0 == "## [" version "]" { found=1; print; next }
            found && $0 ~ /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Fall back to Unreleased section
          if [[ ! -s release-notes.md ]]; then
            awk '
              BEGIN { found=0 }
              $0 == "## [Unreleased]" { found=1; print; next }
              found && $0 ~ /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi

          # Rewrite [Unreleased] heading to the actual version
          if head -1 release-notes.md | grep -qF '## [Unreleased]'; then
            sed -i "1s/## \[Unreleased\]/## [${VERSION}]/" release-notes.md
          fi

          # Append a file-change summary since the previous tag
          PREV_TAG="$(git tag --sort=-creatordate | head -1 || true)"
          if [[ -n "$PREV_TAG" ]]; then
            {
              echo ''
              echo '### Changed files'
              echo ''
              echo '```'
              git diff --stat "$PREV_TAG"..HEAD -- . ':!.git' ':!.bkp' ':!.ignore' ':!*.BAK'
              echo '```'
            } >> release-notes.md
          fi

          # Final fallback
          if [[ ! -s release-notes.md ]]; then
            printf 'Release %s. See CHANGELOG.md for details.\n' "$VERSION" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.checksum }}
            Danish.zip
            Danish.zip.sha256
            Dutch.zip
            Dutch.zip.sha256
            Finnish.zip
            Finnish.zip.sha256
            French.zip
            French.zip.sha256
            German.zip
            German.zip.sha256
            Italian.zip
            Italian.zip.sha256
            Norwgian.zip
            Norwgian.zip.sha256
            Polish.zip
            Polish.zip.sha256
            Portgese.zip
            Portgese.zip.sha256
            Spanish.zip
            Spanish.zip.sha256
            Swedish.zip
            Swedish.zip.sha256
            English.zip
            English.zip.sha256
            UKEnglsh.zip
            UKEnglsh.zip.sha256
            All-languages.zip
            All-languages.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
