name: deploy-pages.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp .website/index.html .website/languages.html .website/install.html .website/tools.html .website/releases.html .website/license.html .website/404.html .website/styles.css _site/
          test -f _site/index.html
          test -f _site/styles.css
          test ! -e _site/script.js
          test ! -e _site/.bkp
          test ! -e _site/.ignore
          ! find _site -type f \( -name '*.BAK' -o -name '*.DAT' -o -name '*.dat' \) -print -quit | grep -q .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
